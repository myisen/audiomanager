[workspace]
resolver = "2"
members = [
    "crates/core-store",
    "crates/core-log",
    "crates/core-library",
    "crates/core-playlist",
    "crates/core-player",
    "crates/core-position",
    "crates/core-cast",
    "crates/core-transfer",
    "crates/core-metadata",
    "crates/core-share",
    "crates/core-config",
    "crates/core-ipc",
    "crates/core-platform",
    "crates/core-jni",
    "crates/app-daemon",
    "crates/app-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/audiosync/audio-manager"

[workspace.dependencies]
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "1"

# 异步
tokio = { version = "1", features = ["full"] }

# 文件系统增强
tokio-util = "0.7"
async-trait = "0.1"

# 路径处理
camino = { version = "1", features = ["serde1"] }

# 音频解码（Q14: Symphonia，MPL-2.0 许可，与 MIT 分发兼容）
# T21 验证：Symphonia 0.5 支持 mp3/aac/flac/ogg/vorbis/m4a/wav；
# 不支持 opus/ape/wv/mka（方案 A：纳入库但标记不可播放）
symphonia = { version = "0.5", default-features = false, features = [
    "isomp4",
    "aac",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "wav",
    "pcm",
] }
